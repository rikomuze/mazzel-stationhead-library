<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <title>MAZZEL Stationhead Library</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">PRIVATE ARCHIVE</p>
      <h1>Stationhead Library</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center"><a href="../" style="color:#b8bdca;text-decoration:none;font-size:10px;border:1px solid #262b38;border-radius:999px;padding:8px 10px">TOP</a><button id="favOnlyBtn" class="round" aria-label="お気に入りのみ">♡</button></div>
  </header>

  <main>
    <section class="section-head">
      <div>
        <p class="section-kicker">ARCHIVE</p>
        <h2>Recorded shows</h2>
      </div>
      <span id="filterLabel" class="filter-label">ALL</span>
    </section>

    <section class="controls">
      <label class="search">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="日付・出演者・シリーズ・メモを検索">
      </label>
      <div id="memberChips" class="chips"></div>
      <div class="status-row">
        <button class="status-btn active" data-status="all">すべて</button>
        <button class="status-btn" data-status="ready">音源あり</button>
        <button class="status-btn" data-status="missing">音源未登録</button>
      </div>
    </section>

    <section class="summary">
      <span id="countLabel">0 shows</span>
      <span class="summary-note">新しい順</span>
    </section>

    <section id="episodeList" class="episode-list"></section>
  </main>

  <template id="episodeTemplate">
    <article class="episode-card">
      <div class="card-head">
        <div class="card-title-wrap">
          <p class="date"></p>
          <h3 class="series"></h3>
        </div>
        <button class="fav-btn round" aria-label="お気に入り">♡</button>
      </div>
      <div class="members"></div>
      <p class="memo"></p>
      <div class="player-wrap"></div>
      <div class="meta"></div>
    </article>
  </template>

  <script type="module" src="./app.js"></script>
</body>
</html>
